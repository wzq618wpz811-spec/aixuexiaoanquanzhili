<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知安 · 界面方案对比</title><link rel="stylesheet" href="/design-options.css"><link rel="icon" href="data:,"></head>
<body><main class="design-workbench"><header class="workbench-heading"><a href="/student" class="back">← 返回产品</a><span class="kicker">知安 · 界面方向</span><h1>同一个知安，三种不同的气质。</h1><p>切换方案，看看学生端与教师端的整体布局。以下为界面示意。</p></header>
<div class="directions" role="tablist" aria-label="界面方案">
<button role="tab" aria-selected="true" data-design="a"><span class="swatches"><i style="background:#2e66cd"></i><i style="background:#e6eefb"></i><i style="background:#fff"></i></span><span><b>A · 清爽学院</b><small>蓝白 · 大留白 · 专注学习</small></span></button>
<button role="tab" aria-selected="false" data-design="b"><span class="swatches"><i style="background:#dc6e4e"></i><i style="background:#fbecd3"></i><i style="background:#75b5c5"></i></span><span><b>B · 元气学伴</b><small>奶油珊瑚 · 卡通角色 · 轻闯关</small></span></button>
<button role="tab" aria-selected="false" data-design="c"><span class="swatches"><i style="background:#173c37"></i><i style="background:#b6ce8b"></i><i style="background:#eef0e9"></i></span><span><b>C · 沉静工作台</b><small>深青 · 编辑式排版 · 清晰秩序</small></span></button></div>
<div class="preview-controls"><div role="tablist" aria-label="预览身份"><button data-role="student" class="active">学生端</button><button data-role="teacher">教师端</button></div><div><button id="device" aria-pressed="false">窄屏预览</button><span id="design-label">A · 清爽学院</span></div></div>
<div class="preview-shell"><section id="preview" class="preview theme-a" aria-label="界面预览"></section></div><footer>可直接告诉我：选 A、B 或 C，也可以组合喜欢的部分。</footer></main><script src="/design-options.js"></script></body></html>
